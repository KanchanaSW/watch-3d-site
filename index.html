<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronos — Inside the Watch</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23080808'/%3E%3Crect x='3' y='3' width='26' height='26' rx='2' fill='none' stroke='%23C6A15B' stroke-width='2'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='sans-serif' font-size='11' font-weight='700' fill='%23C6A15B'%3E3D%3C/text%3E%3C/svg%3E"
    />
    <meta name="description" content="" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="gl"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
    </div>

    <header class="chrome">
      <span class="mark" data-ui="mark"></span>
      <span class="wordmark" data-ui="wordmark"></span>
      <span class="year" data-ui="badge"></span>
    </header>

    <section class="hero" data-ui="hero">
      <p class="eyebrow" data-ui="eyebrow"></p>
      <h1 data-ui="headline"></h1>
      <p class="subtitle" data-ui="subtitle"></p>
      <p class="lede" data-ui="lede"></p>
    </section>

    <aside class="chapter" data-ui="chapter" aria-live="polite">
      <span class="chapter-index" data-ui="index"></span>
      <h2 data-ui="title"></h2>
      <p data-ui="kicker"></p>
      <p data-ui="copy"></p>
      <p data-ui="body"></p>
      <ul data-ui="facts"></ul>
    </aside>

    <div class="callouts" data-ui="callouts"></div>

    <nav class="rail" aria-label="Layer progress">
      <span class="rail-label">Layer</span>
      <ol data-ui="rail"></ol>
    </nav>

    <p class="hint" data-ui="hint">
      <span class="hint-line"></span>
      <span data-ui="hint-label"></span>
    </p>

    <footer class="colophon" data-ui="colophon">
      <p data-ui="colophon-title"></p>
      <p class="fine" data-ui="colophon-fine"></p>
      <p class="colophon-note" data-ui="colophon-note"></p>
    </footer>

    <div class="scroll-track" aria-hidden="true"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
